apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ollama-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Cornel71/ollama-gitops.git'
    targetRevision: HEAD
    path: k8s
  destination:
    server: 'https://default.svc'
    namespace: ollama
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
