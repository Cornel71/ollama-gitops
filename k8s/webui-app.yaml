apiVersion: apps/v1
kind: Deployment
metadata:
  name: webui
  namespace: ollama
  labels:
    app: webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webui
  template:
    metadata:
      labels:
        app: webui
    spec:
      nodeSelector:
        kubernetes.io/hostname: node1
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 10
      volumes:
        - name: html
          configMap:
            name: webui-html
        - name: nginx-conf
          configMap:
            name: webui-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: webui
  namespace: ollama
spec:
  selector:
    app: webui
  ports:
    - port: 80
      targetPort: 80
      name: http
  type: ClusterIP
