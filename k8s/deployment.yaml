apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      initContainers:
      - name: download-model
        image: ollama/ollama:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            ollama serve &
            echo "Waiting for temporary Ollama server to start...";
            until client_out=$(ollama list 2>&1); do sleep 1; done;
            echo "Downloading phi3 model (you can change this to mistral, llama3, etc.)...";
            ollama pull ph13;
            echo "Model downloaded successfully!";
        volumeMounts:
        - name: ollama-storage
          mountPath: /root/.ollama

      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
          name: api
        resources:
          limits:
            cpu: "4"
            memory: 8Gi
          requests:
            cpu: "2"
            memory: 4Gi
        volumeMounts:
        - name: ollama-storage
          mountPath: /root/.ollama

      volumes:
      - name: ollama-storage
        hostPath:
          path: /data/ollama
          type: DirectoryOrCreate
